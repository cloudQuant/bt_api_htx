[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bt_api_htx"
version = "0.15.1"
description = "HTX (Huobi) exchange plugin for bt_api"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "bt_api_base>=0.15,<1.0",
]

[project.entry-points."bt_api.plugins"]
htx = "bt_api_htx.plugin:register_plugin"

[project.entry-points."bt_api.order_identity_projections"]
HTX___SPOT = "bt_api_base.order_identity_projection:project_legacy_order_identity"
HTX___MARGIN = "bt_api_base.order_identity_projection:project_legacy_order_identity"
HTX___USDT_SWAP = "bt_api_base.order_identity_projection:project_legacy_order_identity"
HTX___COIN_SWAP = "bt_api_base.order_identity_projection:project_legacy_order_identity"
HTX___OPTION = "bt_api_base.order_identity_projection:project_legacy_order_identity"

[project.entry-points."bt_api.order_request_projections"]
HTX___SPOT = "bt_api_base.order_request_projection:legacy_order_request_projection"
HTX___MARGIN = "bt_api_base.order_request_projection:legacy_order_request_projection"
HTX___USDT_SWAP = "bt_api_base.order_request_projection:legacy_order_request_projection"
HTX___COIN_SWAP = "bt_api_base.order_request_projection:legacy_order_request_projection"
HTX___OPTION = "bt_api_base.order_request_projection:legacy_order_request_projection"

[project.entry-points."bt_api.order_quantity_unit_validators"]
HTX___SPOT = "bt_api_base.order_quantity_units:validate_generic_order_quantity_units"
HTX___MARGIN = "bt_api_base.order_quantity_units:validate_generic_order_quantity_units"
HTX___USDT_SWAP = "bt_api_base.order_quantity_units:validate_generic_order_quantity_units"
HTX___COIN_SWAP = "bt_api_base.order_quantity_units:validate_generic_order_quantity_units"
HTX___OPTION = "bt_api_base.order_quantity_units:validate_generic_order_quantity_units"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["I", "UP", "E", "F", "W", "TRY003", "TC"]
ignore = [
    "TC002",  # plugin files need bt_api_base imports at runtime
    "TRY003",  # error messages are valid outside exception class
]


[project.entry-points."bt_api.fee_projections"]
HTX___SPOT = "bt_api_base.fee_projection:legacy_fee_projection"
HTX___MARGIN = "bt_api_base.fee_projection:legacy_fee_projection"
HTX___USDT_SWAP = "bt_api_base.fee_projection:legacy_fee_projection"
HTX___COIN_SWAP = "bt_api_base.fee_projection:legacy_fee_projection"
HTX___OPTION = "bt_api_base.fee_projection:legacy_fee_projection"

[project.entry-points."bt_api.order_side_projections"]
HTX___SPOT = "bt_api_base.order_side_projection:legacy_order_side_candidates"
HTX___MARGIN = "bt_api_base.order_side_projection:legacy_order_side_candidates"
HTX___USDT_SWAP = "bt_api_base.order_side_projection:legacy_order_side_candidates"
HTX___COIN_SWAP = "bt_api_base.order_side_projection:legacy_order_side_candidates"
HTX___OPTION = "bt_api_base.order_side_projection:legacy_order_side_candidates"

[project.entry-points."bt_api.normalization_policies"]
HTX___SPOT = "bt_api_htx.normalization_policy:normalization_policy"
HTX___MARGIN = "bt_api_htx.normalization_policy:normalization_policy"
HTX___USDT_SWAP = "bt_api_htx.normalization_policy:normalization_policy"
HTX___COIN_SWAP = "bt_api_htx.normalization_policy:normalization_policy"
HTX___OPTION = "bt_api_htx.normalization_policy:normalization_policy"

[project.entry-points."bt_api.execution_configuration_policies"]
HTX___SPOT = "bt_api_base.execution_configuration_policy:legacy_execution_configuration_policy"
HTX___MARGIN = "bt_api_base.execution_configuration_policy:legacy_execution_configuration_policy"
HTX___USDT_SWAP = "bt_api_base.execution_configuration_policy:legacy_execution_configuration_policy"
HTX___COIN_SWAP = "bt_api_base.execution_configuration_policy:legacy_execution_configuration_policy"
HTX___OPTION = "bt_api_base.execution_configuration_policy:legacy_execution_configuration_policy"

[project.entry-points."bt_api.execution_ledger_identity_policies"]
HTX = "bt_api_base.execution_ledger_identity_policy:legacy_ledger_policy"

[project.entry-points."bt_api.account_risk_source_policies"]
HTX = "bt_api_base.account_risk_source_policy:legacy_account_risk_source_policy"
